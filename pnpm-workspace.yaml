minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - daisyui@5.8.2

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici@6.22.0
  - undici-types@6.21.0

shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

catalogs:
  default:
    '@antfu/eslint-config': ^10.0.0
    '@mdi/js': ^7.4.47
    '@release-it/conventional-changelog': ^12.0.2
    '@tailwindcss/vite': ^4.3.5
    '@types/node': ^26.6.6
    '@vitejs/plugin-vue': ^6.0.11
    '@vitest/coverage-v8': ^5.1.1
    '@vue/test-utils': ^2.6.0
    daisyui: ^5.8.2
    eslint: ^10.15.0
    eslint-plugin-better-tailwindcss: ^4.11.0
    eslint-plugin-vuejs-accessibility: ^2.6.3
    jsdom: ^31.0.1
    release-it: ^21.1.2
    shiki: ^4.6.0
    tailwindcss: ^4.3.5
    typescript: ^6.0.3
    vike: ^0.4.270
    vike-vue: ^0.9.16
    vite: ^8.3.8
    vite-plugin-dts: ^5.1.2
    vitest: ^5.1.1
    vue: ^3.5.46
    vue-tsc: ^3.3.14
